<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sepi Skate</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="playground" aria-label="Interactive pixel skateboard game">
      <div class="stage" id="stage">
        <canvas
          id="game"
          tabindex="0"
          aria-label="Skate game. Hold right arrow or D to push. Space to ollie, X to kickflip, Z to shuv-it. Hold C to manual. Hold down arrow to grind: add left arrow for a boardslide or right arrow for a 5–0. On touch, hold Grind and slide left or right. Release a manual before the balance bar fills. Land and roll away to bank your combo. P to pause."
        ></canvas>
        <div class="hud">
          <div>
            <span class="hud-label">BANKED</span
            ><strong id="score">00000</strong>
          </div>
          <div class="pace-meter" id="pace-meter" aria-label="Skating pace">
            <span class="hud-label" id="pace-label">CRUISE</span
            ><strong id="pace">1.0&#215;</strong
            ><span class="pace-track"><i></i></span>
          </div>
          <div class="best">
            <span class="hud-label">PERSONAL BEST</span
            ><strong id="best">00000</strong>
          </div>
        </div>
        <div id="callout" class="callout" aria-live="polite"></div>
        <div
          id="combo-panel"
          class="combo-panel hidden"
          aria-label="Unbanked combo"
        >
          <span id="combo-tricks" class="combo-tricks"></span>
          <div class="combo-details">
            <strong id="combo-value">+0</strong>
            <span id="combo-multiplier">1&#215;</span>
            <span id="combo-status">At risk</span>
          </div>
          <span class="combo-progress" aria-hidden="true"><i></i></span>
        </div>
        <div class="overlay is-ready" id="overlay">
          <h2 id="overlay-title"></h2>
          <p id="overlay-copy"></p>
          <button class="play" id="play">Let's skate</button>
        </div>
      </div>
      <div class="game-bottom">
        <div class="keyboard-controls" aria-label="Game controls">
          <span title="Hold right arrow or D"><kbd>&#8594;</kbd> push</span>
          <span><kbd>Space</kbd> jump</span>
          <span><kbd>X</kbd> flip</span>
          <span><kbd>Z</kbd> shuv-it</span>
          <span title="Hold C; release before the balance bar fills"
            ><kbd>C</kbd> manual</span
          >
          <span
            title="Hold down for 50–50; add left for boardslide or right for 5–0"
            ><kbd>&#8595; + &#8592;/&#8594;</kbd> grinds</span
          >
          <span><kbd>P</kbd> pause</span>
        </div>
      </div>
      <div class="touch-controls">
        <button id="push" aria-label="Hold to push faster">
          &#8594; <span>HOLD TO PUSH</span>
        </button>
        <button id="jump">&#8593; <span>OLLIE</span></button>
        <button id="flip">&#10023; <span>KICKFLIP</span></button>
        <button id="shuvit" aria-label="Shuv-it in the air">
          &#8634; <span>SHUV-IT</span>
        </button>
        <button
          id="manual"
          aria-label="Hold to manual; release before the balance bar fills"
          aria-pressed="false"
        >
          &#8596; <span>HOLD TO MANUAL</span>
        </button>
        <button
          id="grind"
          aria-label="Hold to grind; slide left for boardslide or right for 5–0"
          aria-pressed="false"
        >
          &#8595; <span id="grind-label">HOLD + SLIDE</span>
        </button>
      </div>
    </main>
    <script src="audio.js"></script>
    <script src="game.js"></script>
  </body>
</html>
